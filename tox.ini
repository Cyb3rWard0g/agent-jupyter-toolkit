[tox]
envlist = toolkit, mcp, lint, format

# ── agent-jupyter-toolkit tests ─────────────────────────
[testenv:toolkit]
description = Run agent-jupyter-toolkit tests
changedir = packages/agent-jupyter-toolkit
skip_install = true
deps = {tox_root}/packages/agent-jupyter-toolkit[dev,dataframe,local,batch]
commands =
    pytest {posargs}

# ── mcp-jupyter-notebook tests ──────────────────────────
[testenv:mcp]
description = Run mcp-jupyter-notebook tests
changedir = packages/mcp-jupyter-notebook
skip_install = true
deps =
    {tox_root}/packages/agent-jupyter-toolkit[dataframe]
    {tox_root}/packages/mcp-jupyter-notebook[dev,dataframe]
commands =
    pytest {posargs}

# ── lint ────────────────────────────────────────────────
[testenv:lint]
description = Ruff lint (all packages)
skip_install = true
deps = ruff>=0.14.13
commands = ruff check packages/

[testenv:format]
description = Ruff formatting check (all packages)
skip_install = true
deps = ruff>=0.14.13
commands = ruff format --check packages/

[flake8]
max-line-length = 100
exclude = __pycache__,.tox,.git,build,dist,.venv,repos
